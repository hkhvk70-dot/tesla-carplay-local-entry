name: Build local entry
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify source
        shell: pwsh
        run: ./scripts/verify-source.ps1
      - name: Compile unsigned APK
        shell: pwsh
        run: ./scripts/build.ps1 -AndroidSdkRoot $env:ANDROID_HOME -JavaHome $env:JAVA_HOME -Unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: local-entry-unsigned
          path: build/CarPlay-Local-Entry-0.4.0-unsigned.apk
          if-no-files-found: error
